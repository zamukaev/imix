# Shared by every proxied location. Mounted raw rather than templated, so the
# nginx variables below survive the entrypoint's envsubst pass untouched.

proxy_http_version 1.1;

# What the application needs to reconstruct the request the browser actually
# made. `Host` keeps next-intl's locale routing and the API's CORS check
# looking at the public name; `X-Forwarded-Proto` is what stops Next redirecting
# an https request back to http. The API trusts exactly one hop of
# `X-Forwarded-For` (see apps/api/src/main.ts).
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

# No WebSocket in the shop today. Passing the upgrade through anyway costs
# nothing and is the one header that cannot be added after the fact.
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;

# Off, so a streamed React response reaches the browser as it is produced
# instead of being held until nginx has the whole document.
proxy_buffering off;

proxy_connect_timeout 5s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;
