packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  # prisma query engine binaries
  '@prisma/engines': true
  prisma: true
  # native build tooling pulled in by next-intl and @nestjs/cli
  '@parcel/watcher': true
  '@swc/core': true
  # next/image optimisation
  sharp: true
  # native resolver used by eslint-config-next
  unrs-resolver: true
  # password hashing — native addon, ships prebuilt binaries
  argon2: true
