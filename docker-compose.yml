services:
  db:
    image: postgres:17-alpine
    container_name: imix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: imix
      POSTGRES_PASSWORD: imix
      POSTGRES_DB: imix
    ports:
      # Host 5433 so the container coexists with a native Postgres on 5432.
      - '5433:5432'
    volumes:
      - imix-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U imix -d imix']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  imix-db-data:
